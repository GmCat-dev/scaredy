# Scaredy GmCat (scaredy.gmcat.io): static site + /api/ to the gmcat-scaredy service (127.0.0.1:4186). Claude, 2026-11-19.
# Cert: certbot --webroot.
server {
    listen 2.24.81.237:443 ssl;
    server_name scaredy.gmcat.io;

    ssl_certificate /etc/letsencrypt/live/scaredy.gmcat.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scaredy.gmcat.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sites/scaredy.gmcat.io;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob: https://home.gmcat.io; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # signalling + encrypted relay (nothing stored); no access log, for privacy
    location ^~ /api/ {
        access_log off;
        client_max_body_size 2m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:4186;
    }

    # links carry their secret after "#", which never reaches the server; still, keep page requests out of the log
    location = / { access_log off; try_files /index.html =404; }
    # short links (scaredy.gmcat.io/k7m2-x9pq) open the same page; no log, the code is the link
    location ~ "^/[2-9a-hjkmnp-z]{4}-?[2-9a-hjkmnp-z]{4}$" { access_log off; try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(?:html|css|js|xml|txt)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' blob: https://home.gmcat.io; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    }
    location ^~ /img/ { expires 7d; add_header Cache-Control "public, max-age=604800" always; }
}

server {
    listen 80;
    listen [::]:80;
    server_name scaredy.gmcat.io;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
